<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오서현 | Technical Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; letter-spacing: -0.02em; }
        .grid-border { border: 1px solid #e5e5e5; }
        /* 기울임 효과 완전 제거 */
        .not-italic { font-style: normal !important; }
    </style>
</head>
<body class="p-6 md:p-12 lg:p-20">

    <script>
        const profile = {
            name: "오서현",
            title: "Technical Artist",
            education: "동양미래대학교 컴퓨터소프트웨어공학과 26학번",
            slogan: "아이디어를 현실로 만드는 사람",
            aboutText: "저는 원화 그래픽의 심미성과 컴퓨터 공학의 논리적 구조 사이에서 다리를 놓는 Technical Artist를 지향합니다. 단순히 시각적인 요소를 만드는 것을 넘어, 최적화된 파이프라인과 쉐이더 기술을 통해 아티스트와 개발자 사이의 간극을 메우는 역할을 즐깁니다. 코드로 예술을 구현하고, 공학으로 창의성을 뒷받침하는 저의 여정은 '기술적 완성도'와 '예술적 깊이'라는 두 목표를 향하고 있습니다.",
            email: "example@email.com",
            github: "https://github.com/username"
        };
    </script>

    <!-- Header -->
    <header class="flex justify-between items-end mb-20 border-b border-black pb-8">
        <div>
            <h1 class="text-xs font-bold uppercase tracking-[0.2em] not-italic">OH SEO HYUN</h1>
            <p class="text-[10px] text-gray-500 mt-1 uppercase not-italic">Portfolio / 2026</p>
        </div>
        <div class="text-right">
            <!-- 기울임 제거 및 정갈한 폰트 적용 -->
            <h2 class="text-5xl font-bold tracking-tighter uppercase not-italic" id="name-display"></h2>
            <p class="text-sm mt-2 uppercase tracking-widest not-italic" id="title-display"></p>
        </div>
    </header>

    <!-- Hero / About Section -->
    <section class="grid grid-cols-1 md:grid-cols-12 gap-16 mb-32">
        <div class="md:col-span-5 bg-gray-100 aspect-[4/5] flex items-center justify-center">
            <span class="text-[10px] text-gray-400 font-bold tracking-widest">PROFILE IMAGE</span>
        </div>
        <div class="md:col-span-7 flex flex-col justify-center">
            <h3 class="text-[10px] font-bold uppercase mb-8 tracking-[0.2em]">ABOUT ME</h3>
            <p class="text-2xl font-normal leading-tight mb-8 not-italic" id="slogan-display"></p>
            <p class="text-base text-gray-700 leading-relaxed mb-6 not-italic" id="about-display"></p>
            <p class="text-[11px] font-bold text-black border-l-2 border-black pl-4 uppercase not-italic" id="edu-display"></p>
        </div>
    </section>

    <!-- Projects Section -->
    <section>
        <div class="flex justify-between items-end mb-16">
            <h3 class="text-xs font-bold uppercase tracking-[0.2em]">SELECTED PROJECTS</h3>
            <span class="text-[10px] text-gray-400">01 — 03</span>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-0">
            <div class="grid-border p-8 hover:bg-gray-50 transition cursor-pointer">
                <h4 class="text-lg font-bold mb-2">Graphics Pipeline</h4>
                <p class="text-[11px] text-gray-500 uppercase tracking-widest">Tool Development</p>
            </div>
            <div class="grid-border p-8 hover:bg-gray-50 transition cursor-pointer">
                <h4 class="text-lg font-bold mb-2">Shader Studies</h4>
                <p class="text-[11px] text-gray-500 uppercase tracking-widest">Visual Research</p>
            </div>
            <div class="grid-border p-8 hover:bg-gray-50 transition cursor-pointer">
                <h4 class="text-lg font-bold mb-2">Engine Tools</h4>
                <p class="text-[11px] text-gray-500 uppercase tracking-widest">Optimization</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="mt-32 pt-12 border-t border-black flex justify-between text-[10px] uppercase tracking-widest">
        <p>© 2026 SEOHYUN OH.</p>
        <div class="flex gap-8">
            <a href="#" id="email-display" class="hover:underline"></a>
            <a href="#" class="hover:underline">GITHUB</a>
        </div>
    </footer>

    <script>
        document.getElementById('name-display').innerText = profile.name;
        document.getElementById('title-display').innerText = profile.title;
        document.getElementById('slogan-display').innerText = profile.slogan;
        document.getElementById('edu-display').innerText = profile.education;
        document.getElementById('about-display').innerText = profile.aboutText;
        document.getElementById('email-display').innerText = profile.email;
    </script>
</body>
</html>
